<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spidey Scrapbook | Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Go to home page">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <p class="brand-title">Spidey Scrapbook</p>
          <p class="brand-sub">Gallery Issue</p>
        </div>
      </a>

      <nav class="nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="origin.html">Origin</a>
        <a href="villains.html">Villains</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <article class="panel">
      <div class="caption">Issue #4 • Gallery</div>
      <h1 class="panel-title">Comic Panels</h1>

      <!-- Elements NOT in your list:
           <figure> groups media with a <figcaption> description -->
      <section class="gallery" aria-label="Image gallery">

        <figure class="card">
          <img src="media/greengoblin.jpg" alt="A villain silhouette with green lighting" loading="lazy">
          <figcaption>Green Goblin </figcaption>
        </figure>

        <figure class="card">
          <img src="media/doctorock.jpg" alt="Mechanical arms reaching forward" loading="lazy">
          <figcaption>Doc Ock</figcaption>
        </figure>

        <figure class="card">
          <img src="media/venom.jpg" alt="Dark creature-like figure with a glossy texture" loading="lazy">
          <figcaption>Venom!</figcaption>
        </figure>
      </section>
    </article>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <p class="small">© 2026 Steven</p>
    </div>
  </footer>
